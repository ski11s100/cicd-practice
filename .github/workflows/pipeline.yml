name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ошибки и стиль (ruff check)
        run: ruff check .
      - name: Форматирование (ruff format)
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Тесты
        run: pytest -v

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Сборка образов
        run: docker compose build
      - name: Запуск всего приложения
        run: docker compose up -d --wait --wait-timeout 120
      - name: Смоук-тест через nginx
        run: |
          curl -fsS localhost:8082/api/health
          curl -fsS -X POST localhost:8082/api/tasks \
            -H 'Content-Type: application/json' -d '{"title":"smoke"}'
          curl -fsS localhost:8082/ | grep -q "Список задач"
      - name: Логи (если упало)
        if: failure()
        run: docker compose logs
      - name: Остановить
        if: always()
        run: docker compose down -v
