# Локальный запуск всего приложения:  docker compose up --build
# Открыть: http://localhost:8082
name: todo-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5433:5432" # снаружи 5433, чтобы не конфликтовать с другим PostgreSQL
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro # создаёт БД todo_test для тестов
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: ${IMAGE_PREFIX:-cicd-practice}-backend:${IMAGE_TAG:-local}
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://todo:todo@db:5432/todo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    image: ${IMAGE_PREFIX:-cicd-practice}-frontend:${IMAGE_TAG:-local}
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
