# Контур (dev или prod). Ничего не собирает — запускает ГОТОВЫЕ образы из реестра GHCR,
# которые пайплайн уже собрал и проверил. Запускается скриптом deploy.ps1.
#
# Что отличает контуры друг от друга (всё приходит снаружи):
#   IMAGE_TAG   — какую версию запускать (sha-1a2b3c4)
#   APP_ENV, HTTP_PORT — из файла dev.env / prod.env
#   DB_PASSWORD — секрет из GitHub Environments, в репозитории его нет
# Плюс у каждого контура свой compose-проект (todo-dev / todo-prod), а значит своя сеть и свой том с БД.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      POSTGRES_DB: todo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is not set}-backend:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is not set}
      DATABASE_URL: postgresql://todo:${DB_PASSWORD}@db:5432/todo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:?HTTP_PORT is not set}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
